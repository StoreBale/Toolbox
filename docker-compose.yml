services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: toolbox
      POSTGRES_USER: toolbox
      POSTGRES_PASSWORD: toolbox
    ports:
      - "5432:5432"
    volumes:
      - toolbox_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbox -d toolbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toolbox_postgres:
